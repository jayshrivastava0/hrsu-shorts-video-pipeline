company: HRSU Indore Pvt. Ltd.
domain: hrsuindore.com
tagline: "Beyond Granules. The Purity of Powder."
differentiators:
  - id: b_purity
    text: "Consistent high-purity calcium nitrate powder with batch-level QC"
  - id: b_supply
    text: "Flexible minimum order quantities and responsive quoting for trial orders"
  - id: b_esg
    text: "Solar power and steam-reuse initiatives at the Indore plant"
cta_lines:
  - "Full technical guide on the HRSU blog — link in description."
  - "Sourcing calcium nitrate? Visit hrsuindore.com"
banned_claims:
  - "REACH registered"
  - "REACH-registered"
  - "certified"
  - "ISO 9001"
  - "FDA approved"

# Fact tiers (owner-supplied 2026-10-29). Only in_place may be stated as true.
# in_progress must never be stated as done. never_claimed must not be presented as true.
in_place:
  - "HRSU delivers to the buyer's door: the quotation covers delivery to the buyer's site (a delivered-to-place basis), and the buyer pays the transport cost as part of the price. A door-delivery quotation is a real offer. Do not talk about 'agreeing any trade term'; say only that HRSU delivers to your door and quotes it that way. Which Incoterm (DAP or DDP) and who clears import customs are NOT confirmed, so never claim that customs, duties or paperwork are handled for the buyer"
  - "Anything printed on the current CoA or TDS (assay, specification limits, packaging, minimum order, shelf life, hazard class) may be shown on screen, quoted as printed"
  - "A garden at the plant"
  - "Steam reuse running in one boiler"
  - "Reaction waste (the impurities) is disposed of with government-authority approval, and the authority collects it"
  - "Ash from the wood fire is used in agriculture"
  - "A scrubber on one reaction vessel"
  - "Chimneys on three reaction boilers, all above the government's threshold height (say exactly that and no more; never \"fully compliant with all regulations\")"
  - "Solar power (size or share of plant power not stated, so no figure is shown)"
  - "Rainwater harvesting"
  - "Company-sponsored employee retreat to a religious site, chosen by employee vote, free of cost to employees"
in_progress:
  - "Steam reuse is being expanded to the other boilers"
  - "The scrubber is being expanded to the other reaction vessels"
  - "The chimneys on two of the three boilers are lower than the first one and are being raised to the same height as it"
  - "The new expansion plans to stop burning wood and run on electricity; the electricity department has not yet approved it, so it may only be described as planned and pending approval"
never_claimed:
  - "Any CSR programme. CSR activity is very small; videos must not present HRSU as having a CSR programme"
