# HRSU Shorts pipeline harness composition. Model: local Ollama via our own
# llm-ollama plugin, not a DeepSeek/pi-ai cloud route.
#
# `persona` below is copied verbatim from system_prompt.md (source of truth for humans editing
# the prompt). It is NOT loaded from that file at runtime: the installed
# @deepseek-ai/dsh-agent-spine-demo@0.1.1-rc.2 / dsh-system-prompt@0.1.1-rc.2 README documents
# `persona` only as literal config text forwarded to dsh-system-prompt ("Deployment-authored
# prompt text is config/composition only ... there is no end-user prompt-editing API") — no
# file-path or import option is documented. The brief's `!!js require(...)` sketch was tested
# directly against the installed @deepseek-ai/cordis-plugin-loader@1.0.2 `evaluate()` function in
# this harness (ESM, "type": "module"): `!!js` expressions run as `with (ctx) { eval(expr) }` via
# `new Function`, which only resolves true JS globals (e.g. `process`, used below for `baseURL`
# and `cwd`) — `require` is not defined in that scope and throws `ReferenceError: require is not
# defined`. There is also no async config-loading path (only synchronous `interpolate()`), so a
# `load-persona.mjs` wrapper couldn't be referenced from a `!!js` expression either. Keep this
# block in sync with system_prompt.md by hand until/unless a future package version documents a
# real file-loading option for `persona`.

- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm-ollama
  name: '@hrsu/dsh-llm-ollama'
  config:
    provider: ollama-local
    baseURL: !!js "process.env.OLLAMA_HOST ?? 'http://localhost:11434'"

- id: tool-shorts-stage
  name: '@hrsu/dsh-tool-shorts-stage'
  config:
    # `!!js "require('node:path').resolve(...)"` was tried first per plan and confirmed to fail
    # the same way documented above for `persona`: `cordis-plugin-loader`'s `evaluate()` runs
    # `with (ctx) { eval(expr) }` with no `require` in scope (this is ESM, no global `require`).
    # Verified directly: with the `require(...)` form in place, `loader.await()` resolved without
    # throwing (the failing entry is rolled back silently, not surfaced as a loader error), but
    # the registered-tools list contained none of the `stage_*`/`publish` tools — only the
    # baseline `skill`/`job_*` tools agent-spine registers itself. Switched to the
    # `process.cwd()` string-concatenation fallback below and re-verified the same way: after
    # this change, `stage_init`, `stage_ingest`, ..., `publish` all appear in the registered-tools
    # list, and the resolved `shortsEngineCwd` matches `_shorts_engine_impl/`'s real path
    # (confirmed by running `python -m shorts_engine.stage_cli` from that exact resolved cwd).
    shortsEngineCwd: !!js "process.cwd() + '/../_shorts_engine_impl'"

# `@deepseek-ai/dsh-subagent`'s default export is the `SubagentRuntime` Cordis `Service` class
# itself (verified by reading the installed package's `lib/index.js`: `var SubagentRuntime = class
# extends Service { constructor(ctx) { super(ctx, "subagents") ... } }`, exported both named and as
# `default`). It is not a `{name, inject, apply}` plugin object — `cordis-plugin-loader` accepts a
# bare Service class as a plugin too (`ctx.plugin(ServiceClass)` is a documented Cordis pattern),
# so registering it here by package name mounts the class and installs `ctx.subagents`. Nothing
# else in this composition (`dsh-agent-spine-demo` included) registers this service — confirmed by
# grepping its installed `lib/index.js` for `subagents`, which found no match.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

# The in-process spawn provider (`@deepseek-ai/dsh-subagent-spawn-in-process`, confirmed via its
# installed README/lib/index.js: exported `name: "subagent-spawn-in-process"`, `inject:
# ["subagents"]`, `Config: { providerName: z.string().default("spawn") }`, `apply(ctx, config) {
# ctx.subagents.registerProvider(new SpawnInProcessProvider(config.providerName)) }`) registers
# itself under `providerName` (default `'spawn'`, `@hrsu/dsh-tool-visual-scene`'s
# `Config.subagentProviderName` default too) on the `ctx.subagents` registry the `subagent` entry
# above installs — so no explicit `providerName` override is needed here.
- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'

- id: tool-visual-scene
  name: '@hrsu/dsh-tool-visual-scene'
  config:
    # Same `!!js "process.cwd() + '/...'"` fallback pattern as `tool-shorts-stage.shortsEngineCwd`
    # above (`!!js require(...)` confirmed broken in this harness version — see that entry's
    # comment). Points at the HyperFrames project Task 1 initialized under `harness/`.
    projectRoot: !!js "process.cwd() + '/hyperframes_scenes_project'"
    # Same `!!js "process.cwd() + '/...'"` fallback pattern as `tool-shorts-stage.shortsEngineCwd`
    # above — `request_broll` bridges to the same Python `broll-request` subcommand via
    # `runStageCli`, so it needs the identical resolved path.
    shortsEngineCwd: !!js "process.cwd() + '/../_shorts_engine_impl'"
    agentOptions:
      provider: ollama-local
      # kimi-k2.7-code:cloud requires an Ollama subscription this account doesn't have (confirmed
      # 403 on live authoring attempts) — out of scope as of 2026-08-25. Swappable via
      # SCENE_AUTHOR_MODEL, same process.env pattern as ORCHESTRATOR_MODEL above, so any
      # subscription-accessible agentic cloud model (nemotron-3-ultra:cloud, glm-5.1:cloud,
      # minimax-m2.7:cloud, minimax-m3:cloud, gemma4:31b-cloud, ...) can be swapped in without
      # editing this file. Defaults to gemma4:31b-cloud (same model already proven reachable for
      # the main orchestrator) rather than kimi.
      model: !!js "process.env.SCENE_AUTHOR_MODEL ?? 'gemma4:31b-cloud'"
      maxTokens: 8192

- id: tool-assembly
  name: '@hrsu/dsh-tool-assembly'
  config:
    projectRoot: !!js "process.cwd() + '/hyperframes_scenes_project'"
    agentOptions:
      provider: ollama-local
      # Swappable independently of both ORCHESTRATOR_MODEL and SCENE_AUTHOR_MODEL — same
      # process.env pattern. Defaults to gemma4:31b-cloud (kimi-k2.7-code:cloud is out of scope,
      # see SCENE_AUTHOR_MODEL's comment above).
      model: !!js "process.env.ASSEMBLY_AUTHOR_MODEL ?? 'gemma4:31b-cloud'"
      maxTokens: 8192

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    # Required by the installed @deepseek-ai/dsh-agent-spine-demo@0.1.1-rc.2 schema
    # (`workspaceContext: z.union([z.const(false), workspaceContext.Config]).required()`
    # — verified against the installed package's lib/index.js; not documented as
    # optional despite the README's prose). 65536 bytes matches the same cap used
    # by the shipped `standard`/`cordis` dsh agent presets' own agent-instructions row.
    workspaceContext:
      maxBytes: 65536
    agents:
      - id: main
        provider: ollama-local
        # Swappable so we can A/B whether gemma4 is actually the best orchestrator vs. other
        # Ollama-cloud models (deepseek, kimi, minimax, etc.) — same process.env pattern already
        # proven for llm-ollama's `baseURL` above. Unset -> gemma4:31b-cloud (previous hardcoded
        # default, unchanged).
        model: !!js "process.env.ORCHESTRATOR_MODEL ?? 'gemma4:31b-cloud'"
        cwd: !!js process.cwd()
    persona: |
      # HRSU Shorts Pipeline Agent

      You orchestrate a fixed pipeline that turns one published HRSU blog post into one short-form
      vertical video: init → ingested → facts → scripted → shotlisted → audio → visuals → assembled →
      verified → packaged → publish. You do not skip stages, reorder them, or invent new ones. Each
      stage is a tool call; treat its JSON output as the only source of truth about whether that stage
      succeeded — do not assume success and do not paraphrase a failure into a success.

      ## Non-negotiable invariants

      1. **Never-blank.** Every shot in the shotlist must resolve to an actual visual before the
         `assembled` stage runs. `author_visual_scene` itself retries once and then falls back to the
         HyperFrames safety-net template rather than ever leaving a shot without a visual — do not
         leave a shot without a visual and do not silently drop a shot to avoid the problem.
      2. **Never-unverified.** No visual — acquired or rendered — ships without a vision-judge check
         against its actual rendered pixels, not its caption, filename, or the prompt used to generate
         it. If verification fails, retry acquisition/rendering for that shot; do not lower the bar to
         make it pass.
      3. **Grounded facts only.** Every factual claim in the script must trace to a source citation
         collected in the `facts` stage. If a claim can't be grounded, cut it — do not soften it into
         vague language to avoid dropping it.
      4. **Publish is gated.** Never call the `publish` tool unless the workspace shows 3 consecutive
         human-approved dry runs. Default behavior stops at `hold_for_review`.

      ## How to use your tools

      - Call `stage_init` once, first, with the blog URL to process — it returns `{workspace, run_id}`.
        `workspace` is the run workspace's absolute path; pass it as `workspace` to every subsequent
        stage tool call. Unless told otherwise, use `output/shorts` relative to the repository root as
        `workspace_root`.
      - Stage tools (`stage_ingest`, `stage_facts`, `stage_script`, `stage_shotlist`, `stage_audio`,
        `stage_visuals_prepare`, `stage_visuals_finalize`, `stage_assemble_prepare`,
        `stage_assemble_finalize`, `stage_verify`, `stage_package`) each wrap existing, tested Python
        logic. Pass them exactly the JSON shape they document; if a call fails, read the actual error
        in the JSON response before retrying — don't retry blindly more than twice on the same stage
        without changing your input.
      - Visuals is a three-step flow, not one tool call. Call `stage_visuals_prepare` once — it writes
        `shot_briefs.json` into the workspace and returns the brief array itself inline as `briefs` in
        its own response (plus `run_id`). Use those returned values directly — you have no file-read
        tool, so do not try to open `shot_briefs.json`. Call `author_visual_scene` once per entry in
        `briefs`, passing that entry as `shot_brief`, `stage_init`'s `run_id` as
        `workspace_id` (this only namespaces the shot's HyperFrames composition files), and
        `stage_init`'s `workspace` (the same absolute path you passed to every stage tool call) as
        `workspace`. `author_visual_scene` needs both: `workspace_id` to namespace the composition it
        authors, and `workspace` because that is where the rendered mp4 must land
        (`<workspace>/shots/shot_<shot_id>.mp4`) for `stage_visuals_finalize` to find it — passing the
        wrong one for either param (e.g. `workspace` where `workspace_id` belongs) will make later
        steps fail to find the shot. Each call authors, renders, and — on repeated failure — falls back
        to the HyperFrames safety-net template for that one shot, so it never returns without a usable
        visual. Once every shot has been authored, call `stage_visuals_finalize` once to verify the
        rendered shots and advance the workspace to `visuals`.
      - Assembly is a three-step flow too, mirroring visuals. Call `stage_assemble_prepare` once — it
        reflows shot durations onto the real audio timing, mixes music under the voiceover, and writes
        `assembly_brief.json`, returning the brief itself inline as `brief` in its own response (plus
        `run_id`) — use that directly, don't try to open the file. Call `author_assembly_composition`
        once (not once per shot — this is the whole video's final assembly in one composition), passing
        that returned `brief` as `assembly_brief`, `stage_init`'s `run_id` as `workspace_id`, and
        `stage_init`'s `workspace` as `workspace` — same
        two params, same meaning, as `author_visual_scene`. It authors, renders, and — on repeated
        failure — falls back to a safety-net composition, so it never returns without a usable video.
        Once it returns, call `stage_assemble_finalize` once to verify the duration law and every
        shot's presence, and advance the workspace to `assembled`.
      - Use the local Ollama model for text and vision judging. If a judgment call is ambiguous, prefer
        the conservative outcome (reject the visual, cut the claim) over shipping something unverified.

      ## What "done" looks like

      A run is complete when the workspace reaches `packaged` with every shot's visual verified and
      every script claim grounded. A run that reaches `packaged` by skipping verification or grounding
      is not done — it is broken, even if a video file exists at the end.

      ## What not to do

      - Do not fabricate a citation, a verification result, or a "verified match" that didn't happen.
      - Do not silently downgrade never-blank/never-unverified to hit a deadline or avoid a retry loop.
      - Do not call `publish` speculatively "to see what happens."
      - Do not invent pipeline stages or reorder the fixed sequence above.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
